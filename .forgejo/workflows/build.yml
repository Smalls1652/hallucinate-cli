# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Build and test
on:
  push:
    tags-ignore: [ 'v*.*.*', 'v*.*.*-*' ]
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/build.toml"
      - "crates/**"
  pull_request:
     paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/build.toml"
      - "crates/**"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: https://git.smalls.online/smallsonline-actions/setup-rs@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project
        shell: bash
        run: |
          make build
  
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: https://git.smalls.online/smallsonline-actions/setup-rs@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Test project
        shell: bash
        run: cargo test --workspace --all-targets
  