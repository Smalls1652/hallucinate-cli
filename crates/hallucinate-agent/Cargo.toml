[package]
name = "hallucinate-agent"
version.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
glob.workspace = true
image = { workspace = true, default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring-core.workspace = true
minijinja.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
shellexpand.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = []
schemas = ["dep:schemars"]

[dev-dependencies]
mockito.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true
