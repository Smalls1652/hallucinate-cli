[workspace]
members = ["crates/hallucinate-cli", "crates/hallucinate-agent", "crates/hallucinate-macros", "crates/hallucinate-session", "crates/hallucinate-tui"]
resolver = "3"

[workspace.package]
description = "LLM harness that's a lot like pi"
version = "0.1.0"
edition = "2024"
publish = ["smalls-personal"]

license-file = "LICENSE"
readme = "README.md"

homepage = "https://git.smalls.online/smalls/hallucinate-cli"
repository = "https://git.smalls.online/smalls/hallucinate-cli"

[workspace.dependencies]
hallucinate-agent = {
    path = "crates/hallucinate-agent",
    version = "*",
    registry = "smalls-personal"
}
hallucinate-tui = {
    path = "crates/hallucinate-tui",
    version = "*",
    registry = "smalls-personal"
}
hallucinate-session = {
    path = "crates/hallucinate-session",
    version = "*",
    registry = "smalls-personal"
}

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }

# AI package
futures = "0.3.34"
tokio-stream = "0.1.19"

# TUI
crossterm = "0.29.0"
unicode-width = "0.2.2"
comrak = "0.54.0"

# Config / paths
directories = "6.0.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# Agent core
regex = "1.13.1"
glob = "0.3.4"
which = "8.0.6"
chrono = { version = "0.4.45", features = ["serde"] }
path-absolutize = "4.0.1"
shellexpand = "3.1.2"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.4"

mockito = "1.7.2"
tokio-test = "0.4.5"

[profile.release]
opt-level = "s"
lto = true

