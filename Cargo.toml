[package]
name = "hallucinate-cli"
description = "LLM harness that's a lot like pi"
version = "0.1.0"
edition = "2024"
publish = ["smalls-personal"]

license-file = "LICENSE"

homepage = "https://git.smalls.online/smalls/hallucinate-cli"
repository = "https://git.smalls.online/smalls/hallucinate-cli"

[[bin]]
name = "hallucinate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "rt", "macros", "fs", "process"] }

# AI package
futures = "0.3"
tokio-stream = "0.1"

# TUI
crossterm = "0.29.0"
unicode-width = "0.2"
comrak = "0.54.0"

# Config / paths
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }

# Agent core
regex = "1"
glob = "0.3"
which = "7"
chrono = { version = "0.4", features = ["serde"] }
path-absolutize = "3"
shellexpand = "3"

# Dev dependencies
tokio-test = "0.4"
mockito = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.4"

[profile.release]
opt-level = "s"
lto = true

